# Déploiement sur le VPS (sevensigils.fantasy-tools.fr).
#
# Déclenché :
#   - automatiquement par release-please.yml quand une Release PR est mergée
#     (une release créée avec GITHUB_TOKEN ne déclenche pas d'autre workflow,
#     d'où l'appel direct via workflow_call) ;
#   - à la main depuis l'onglet Actions (workflow_dispatch), par ex. pour le
#     premier déploiement ou pour redéployer après un incident.
#
# Étapes : build des images API + frontend → publication sur GHCR → copie du
# compose de prod sur le VPS → `docker compose pull && up -d` en SSH.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   VPS_HOST         IP ou nom du VPS
#   VPS_SSH_KEY      clé privée de l'utilisateur `deploy` (clé dédiée au CI)
#   VPS_KNOWN_HOSTS  sortie de `ssh-keyscan -t ed25519 <IP>` (épingle l'empreinte du serveur)
name: deploy

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Tag de la release (vX.Y.Z)
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/gregb342/sevensigils
  APP_DIR: /opt/apps/sevensigils

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag des images
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: SevenSigils.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-api:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-api:latest
            ${{ inputs.version && format('{0}-api:{1}', env.IMAGE_PREFIX, inputs.version) || '' }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: SevenSigils.Frontend
          file: SevenSigils.Frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ inputs.version && format('{0}-frontend:{1}', env.IMAGE_PREFIX, inputs.version) || '' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sevensigils.fantasy-tools.fr
    steps:
      - uses: actions/checkout@v4

      - name: Configurer SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copier le compose de prod
        env:
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          ssh "deploy@$HOST" "mkdir -p $APP_DIR && test -f $APP_DIR/.env || { echo '::error::$APP_DIR/.env absent sur le serveur'; exit 1; }"
          scp docker-compose.prod.yml "deploy@$HOST:$APP_DIR/docker-compose.yml"

      - name: Déployer
        env:
          HOST: ${{ secrets.VPS_HOST }}
          TAG: ${{ needs.build.outputs.tag }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Le jeton GitHub (valable le temps du job) sert à tirer les images
          # même si les paquets GHCR sont privés ; il est transmis par stdin
          # et la session est fermée à la fin.
          printf '%s' "$GHCR_TOKEN" | ssh "deploy@$HOST" \
            "docker login ghcr.io -u ${{ github.actor }} --password-stdin"
          ssh "deploy@$HOST" "cd $APP_DIR \
            && export IMAGE_TAG=$TAG \
            && docker compose pull \
            && docker compose up -d --remove-orphans --wait --wait-timeout 180 ; \
            status=\$?; docker logout ghcr.io >/dev/null; docker image prune -f >/dev/null; exit \$status"

      - name: Vérifier que le site répond
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://sevensigils.fantasy-tools.fr/api/v1/quotes -o /dev/null; then
              echo "Site en ligne"; exit 0
            fi
            sleep 10
          done
          echo "::error::Le site ne répond pas après le déploiement"; exit 1
